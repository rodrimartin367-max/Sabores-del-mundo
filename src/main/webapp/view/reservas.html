<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Sabores del mundo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/main.js" defer></script>
</head>
<body>
    
    <header class="header">
    <h1>Sabores del mundo</h1>
    <nav style="display: flex; gap: 1rem; align-items: center;">
        
        <button id="btn-accede" onclick="window.location.href='index.html?login=true'" class="btn btn-reserva" style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="material-symbols-outlined">login</span> Accede
        </button>
        <button id="btn-mi-perfil" onclick="window.location.href='index.html?perfil=true'" class="btn btn-reserva" style="display: none; align-items: center; gap: 0.5rem;">
            <span class="material-symbols-outlined">person</span> Mi perfil
        </button>
        <button id="btn-cerrar-sesion" onclick="cerrarSesion()" class="btn" style="background-color: #8C3A2A; color: white; display: none; align-items: center; gap: 0.5rem; border: none; cursor: pointer; border-radius: 0.3rem; padding: 0.6rem 1rem; font-family: 'Raleway', sans-serif;">
            <span class="material-symbols-outlined">logout</span> Cerrar sesión
        </button>
    </nav>
</header>

    <main class="reserva-container" style="flex-direction: column;">
        
        <div style="width: 100%; max-width: 40rem; margin-bottom: 1rem; text-align: left;">
            <a href="index.html" class="link-volver">← Volver al inicio</a>
        </div>

        <div class="caja-formulario">
            <h2>Hacer una reserva</h2>
            <hr class="separador-form">

            <form class="formulario" action="#" id="form-reserva" onsubmit="enviarReserva(event)">
                <div class="campo">
                    <label for="restaurante">Restaurante</label>
                    <select id="restaurante" name="restaurante" required>
                        <option value="" disabled selected>Selecciona una sala...</option>
                        <option value="espana">España</option>
                        <option value="chile">Chile</option>
                        <option value="india">India</option>
                        <option value="tailandia">Tailandia</option>
                    </select>
                </div>
                
                <div class="fila-campos">
                    <div class="campo">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="campo">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>
                
                <div class="fila-campos">
                    <div class="campo">
                        <label for="comensales">Número de comensales</label>
                        <input type="number" id="comensales" name="comensales" min="1" max="20" placeholder="Ej: 2" required>
                    </div>
                    
                    <div class="campo">
                        <label>Día y Hora de la reserva</label>
                        <div style="display: flex; gap: 1rem; align-items: flex-start;">
                            
                            <div class="custom-datepicker-container" style="flex: 1; position: relative;">
                                <div class="input-con-icono" onclick="toggleCalendario()">
                                    <input type="text" id="reserva-fecha-texto" placeholder="Selecciona una fecha..." readonly required>
                                    <span class="material-symbols-outlined icono-calendario">calendar_today</span>
                                </div>
                                <input type="hidden" id="reserva-fecha" name="fecha" required>

                                <div class="calendar-dropdown oculto" id="calendar-dropdown">
                                    <div class="calendar-header">
                                        <button type="button" onclick="cambiarMes(-1)" class="btn-mes">&lt;</button>
                                        <span id="calendar-month-year"></span>
                                        <button type="button" onclick="cambiarMes(1)" class="btn-mes">&gt;</button>
                                    </div>
                                    <div class="calendar-weekdays">
                                        <span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span>
                                    </div>
                                    <div class="calendar-days" id="calendar-days"></div>
                                </div>
                            </div>
                            
                            <select id="reserva-hora" name="hora" style="flex: 1;" required>
                                <option value="" disabled selected>Hora...</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-reserva btn-submit">Confirmar Reserva</button>
            </form>
        </div>
    </main>

</body>
</html>
